[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "postgresql-data-service"
version = "0.1.0"
description = "Python data service with pandas and async PostgreSQL support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2.0",
  "asyncpg>=0.30,<1.0",
  "pandas==2.3.3",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/postgresql_data_service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["postgresql_data_service"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

